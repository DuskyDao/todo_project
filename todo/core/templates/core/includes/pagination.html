{% load i18n %}
<div class="pagination">
    {% if is_paginated %}
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}">&laquo; {% trans "Попередня" %}</a>
    {% endif %}
    <span>{% trans "Сторінка" %}: <span class="active"> {{ page_obj.number }} </span>{% trans "із" %} {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}">{% trans "Наступна" %} &raquo;</a>
    {% endif %}
    {% endif %}
</div>
